<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="tc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#tc-bg)"/>
  <g opacity=".18">
    <circle cx="36" cy="44" r="2.5" fill="#fff"/>
    <circle cx="166" cy="52" r="2" fill="#fff"/>
    <circle cx="150" cy="28" r="2.5" fill="#fff"/>
    <circle cx="28" cy="120" r="2" fill="#fff"/>
    <circle cx="178" cy="150" r="2.5" fill="#fff"/>
  </g>
  <!-- isometric tile path -->
  <g opacity=".5">
    <polygon points="100,150 140,128 100,106 60,128" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <polygon points="60,128 100,106 100,84 60,106" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  </g>
  <!-- rolling cube -->
  <g transform="translate(100 70)">
    <polygon points="0,-30 34,-11 0,8 -34,-11" fill="#f87171"/>
    <polygon points="-34,-11 0,8 0,46 -34,27" fill="#dc2626"/>
    <polygon points="34,-11 0,8 0,46 34,27" fill="#ef4444"/>
    <polygon points="0,-30 34,-11 0,8 -34,-11" fill="none" stroke="#fff" stroke-width="1.5" opacity=".4"/>
  </g>
  <text x="100" y="190" text-anchor="middle" fill="#fff" font-family="Arial Black" font-size="20" font-weight="900">TRANSCUBE</text>
</svg>
