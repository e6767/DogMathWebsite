<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="ib-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#ib-bg)"/>
  <!-- brick rows -->
  <g>
    <rect x="14" y="28" width="28" height="14" rx="2" fill="#ef4444"/>
    <rect x="46" y="28" width="28" height="14" rx="2" fill="#f97316"/>
    <rect x="78" y="28" width="28" height="14" rx="2" fill="#eab308"/>
    <rect x="110" y="28" width="28" height="14" rx="2" fill="#22c55e"/>
    <rect x="142" y="28" width="28" height="14" rx="2" fill="#3b82f6"/>

    <rect x="14" y="46" width="28" height="14" rx="2" fill="#f97316"/>
    <rect x="46" y="46" width="28" height="14" rx="2" fill="#eab308"/>
    <rect x="78" y="46" width="28" height="14" rx="2" fill="#22c55e"/>
    <rect x="110" y="46" width="28" height="14" rx="2" fill="#3b82f6"/>
    <rect x="142" y="46" width="28" height="14" rx="2" fill="#a855f7"/>

    <rect x="14" y="64" width="28" height="14" rx="2" fill="#eab308"/>
    <rect x="46" y="64" width="28" height="14" rx="2" fill="#22c55e"/>
    <rect x="110" y="64" width="28" height="14" rx="2" fill="#a855f7"/>
    <rect x="142" y="64" width="28" height="14" rx="2" fill="#ef4444"/>
  </g>
  <!-- bouncing balls + motion trails -->
  <g opacity=".4">
    <line x1="70" y1="95" x2="60" y2="110" stroke="#fde047" stroke-width="2"/>
    <line x1="130" y1="115" x2="140" y2="100" stroke="#f87171" stroke-width="2"/>
  </g>
  <circle cx="70" cy="95" r="6" fill="#fde047"/>
  <circle cx="130" cy="115" r="6" fill="#f87171"/>
  <circle cx="100" cy="130" r="5" fill="#60a5fa"/>
  <!-- labels -->
  <text x="100" y="168" text-anchor="middle" fill="#fde047" font-family="Arial Black" font-size="22" font-weight="900">IDLE</text>
  <text x="100" y="190" text-anchor="middle" fill="#fff" font-family="Arial Black" font-size="18" font-weight="900">BREAKOUT</text>
</svg>
