<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="ssz-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1565c0"/>
      <stop offset="1" stop-color="#bbdefb"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#ssz-sky)"/>
  <!-- Alps mountains back layer -->
  <polygon points="0,140 40,60 80,140" fill="#90caf9" opacity="0.7"/>
  <polygon points="50,140 100,50 150,140" fill="#e3f2fd"/>
  <polygon points="120,140 165,65 200,140" fill="#90caf9" opacity="0.7"/>
  <!-- Snow caps -->
  <polygon points="40,60 52,90 28,90" fill="#fff"/>
  <polygon points="100,50 114,82 86,82" fill="#fff"/>
  <polygon points="165,65 177,92 153,92" fill="#fff"/>
  <!-- Grossmünster twin spires silhouette -->
  <rect x="84" y="108" width="14" height="32" fill="#37474f"/>
  <rect x="102" y="108" width="14" height="32" fill="#37474f"/>
  <polygon points="84,108 91,96 98,108" fill="#546e7a"/>
  <polygon points="102,108 109,96 116,108" fill="#546e7a"/>
  <!-- Train tracks -->
  <rect x="0" y="155" width="200" height="45" fill="#263238"/>
  <line x1="0" y1="162" x2="200" y2="162" stroke="#fdd835" stroke-width="2"/>
  <line x1="0" y1="190" x2="200" y2="190" stroke="#fdd835" stroke-width="2"/>
  <rect x="0" y="168" width="200" height="4" fill="#37474f"/>
  <!-- Sleepers -->
  <rect x="10" y="160" width="8" height="32" fill="#4e342e" rx="1"/>
  <rect x="40" y="160" width="8" height="32" fill="#4e342e" rx="1"/>
  <rect x="70" y="160" width="8" height="32" fill="#4e342e" rx="1"/>
  <rect x="100" y="160" width="8" height="32" fill="#4e342e" rx="1"/>
  <rect x="130" y="160" width="8" height="32" fill="#4e342e" rx="1"/>
  <rect x="160" y="160" width="8" height="32" fill="#4e342e" rx="1"/>
  <!-- Train car -->
  <rect x="55" y="140" width="90" height="22" rx="3" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
  <rect x="62" y="145" width="16" height="10" fill="#fff" rx="1"/>
  <rect x="84" y="145" width="16" height="10" fill="#fff" rx="1"/>
  <rect x="106" y="145" width="16" height="10" fill="#fff" rx="1"/>
  <!-- Title -->
  <text x="100" y="178" text-anchor="middle" fill="#fff" font-family="Arial Black,sans-serif" font-size="11" font-weight="900" stroke="#0d47a1" stroke-width="0.6">SUBWAY SURFERS</text>
  <text x="100" y="194" text-anchor="middle" fill="#fdd835" font-family="Arial Black,sans-serif" font-size="12" font-weight="900" stroke="#0d47a1" stroke-width="0.5">ZURICH</text>
</svg>
